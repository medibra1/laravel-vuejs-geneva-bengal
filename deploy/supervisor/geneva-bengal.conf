; Only applicable on Infomaniak Cloud Server (VPS, root/SSH access) — see
; DEPLOY.md #2. Infomaniak's shared Web Hosting offer does not give you
; Supervisor/systemd access; on that tier the SSR process is instead
; managed through the "Node.js site" feature in the Manager, and the
; queue is run inline (QUEUE_CONNECTION=sync) rather than as a daemon.
;
; Install: copy to /etc/supervisor/conf.d/geneva-bengal.conf, adjust the
; paths/user below, then `supervisorctl reread && supervisorctl update`.

[program:geneva-bengal-ssr]
; `php artisan inertia:start-ssr` just spawns `node <bundle>` under the
; hood (see docker-compose.yml's own comment on this) — invoked directly
; here so Supervisor supervises the actual long-running process rather
; than an Artisan wrapper around it.
command=node /var/www/geneva-bengal/bootstrap/ssr/ssr.js
directory=/var/www/geneva-bengal
user=www-data
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/var/www/geneva-bengal/storage/logs/supervisor-ssr.log
stderr_logfile=/var/www/geneva-bengal/storage/logs/supervisor-ssr.log
environment=NODE_ENV="production"

[program:geneva-bengal-queue]
; Processes the queued notifications (deposit/contact/newsletter emails)
; and the daily ReconcilePendingDeposits job dispatched by the scheduler
; (see DEPLOY.md #4) — every Notification class in app/Notifications
; implements ShouldQueue, so nothing gets delivered without this running.
; --tries=3 with Laravel's default backoff rather than --tries=1: unlike
; the dev queue (docker-compose.yml, --tries=1, fine for local iteration),
; a transient SMTP/Stripe blip in prod shouldn't drop a notification.
command=php /var/www/geneva-bengal/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/geneva-bengal
user=www-data
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=3600
stdout_logfile=/var/www/geneva-bengal/storage/logs/supervisor-queue.log
stderr_logfile=/var/www/geneva-bengal/storage/logs/supervisor-queue.log
environment=APP_ENV="production"
