services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8280:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_NAME: "Geneva Bengal"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8280
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: geneva_bengal
      DB_USERNAME: geneva_bengal
      DB_PASSWORD: geneva_bengal
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@genevabengals.ch
      MAIL_FROM_NAME: "Geneva Bengal"
      QUEUE_CONNECTION: database
      SUPER_ADMIN_EMAIL: super-admin@example.com
      SUPER_ADMIN_PASSWORD: change-me
      STRIPE_KEY: ""
      STRIPE_SECRET: ""
      STRIPE_WEBHOOK_SECRET: ""
    depends_on:
      - mysql

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --tries=1 --timeout=0
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: geneva_bengal
      DB_USERNAME: geneva_bengal
      DB_PASSWORD: geneva_bengal
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      QUEUE_CONNECTION: database
      STRIPE_KEY: ""
      STRIPE_SECRET: ""
      STRIPE_WEBHOOK_SECRET: ""
    depends_on:
      - mysql

  # Runs Laravel's scheduler in the foreground so the daily deposit
  # reconciliation job (routes/console.php) actually fires — cron doesn't
  # exist inside these containers otherwise.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: geneva_bengal
      DB_USERNAME: geneva_bengal
      DB_PASSWORD: geneva_bengal
      QUEUE_CONNECTION: database
      STRIPE_KEY: ""
      STRIPE_SECRET: ""
      STRIPE_WEBHOOK_SECRET: ""
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: geneva_bengal
      MYSQL_USER: geneva_bengal
      MYSQL_PASSWORD: geneva_bengal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  frontend:
    image: node:22-alpine
    working_dir: /var/www/html
    # Host and container port both changed together (not just remapped)
    # so Vite's HMR websocket, which reports its own listening port to
    # the browser, doesn't end up advertising a port different from the
    # one actually reachable from the host.
    # npm ci (not install): installs strictly from package-lock.json
    # without rewriting it — the container's npm version otherwise
    # touches the host's lock file on every `docker compose up`.
    command: sh -c "npm ci && npm run dev -- --host --port 5273"
    ports:
      - "5273:5273"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  adminer:
    image: adminer:latest
    ports:
      - "8281:8080"
    depends_on:
      - mysql

volumes:
  vendor:
  node_modules:
  mysql_data:
