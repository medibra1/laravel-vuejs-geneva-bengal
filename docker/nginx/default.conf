server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite build output is content-hashed (e.g. app-4f3a1c2b.js), so it's
    # safe to cache aggressively and immutably — a new deploy always
    # produces new filenames, it never overwrites these in place.
    location ^~ /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Photo conversions (jpg/jpeg/png/webp/gif) come from
    # spatie/laravel-medialibrary, whose URLs are keyed by media ID — the
    # same URL never changes content, so a 30-day cache is safe.
    location ~* \.(?:jpg|jpeg|png|webp|gif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Everything else static served straight from public/ (favicons,
    # robots.txt, fonts, non-hashed css/js) isn't ID-keyed and can be
    # swapped in place by a redeploy, so it keeps a shorter lifetime.
    location ~* \.(?:svg|ico|woff2?|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
