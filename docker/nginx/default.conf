server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite build output is content-hashed (e.g. app-4f3a1c2b.js), so it's
    # safe to cache aggressively and immutably — a new deploy always
    # produces new filenames, it never overwrites these in place.
    location ^~ /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static assets served straight from public/ (favicons, robots.txt,
    # medialibrary-uploaded images, etc.) are not content-hashed, so a
    # shorter cache lifetime avoids serving a stale file after it's replaced.
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|woff2?|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
